<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tally — Adding Machine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="app">
      <header class="brand-block">
        <h1 class="brand">Tally</h1>
        <p class="lede">Every figure stays on the tape.</p>
      </header>

      <section class="machine" aria-label="Adding machine">
        <div class="tape-panel">
          <div class="tape-head">
            <span class="tape-label">Tape</span>
            <button type="button" id="btn-clear-all" class="link-btn">Clear tape</button>
          </div>

          <div class="tape-scroll" id="tape-scroll" tabindex="0" aria-live="polite">
            <ol id="tape-list" class="tape-list"></ol>
            <p id="tape-empty" class="tape-empty">Enter a number, then press + or −.</p>
          </div>

          <div class="total-row">
            <span class="total-label">Total</span>
            <output id="total-value" class="total-value" for="tape-list">0</output>
          </div>
        </div>

        <div class="entry-panel">
          <div class="entry-readout" aria-live="polite">
            <span class="entry-hint" id="entry-hint">Ready</span>
            <output id="entry-value" class="entry-value" aria-label="Current entry">0</output>
          </div>

          <div class="keypad" role="group" aria-label="Number pad">
            <button type="button" class="key key-fn key-ce" data-action="clear-entry">CE</button>
            <button type="button" class="key key-fn key-back" data-action="backspace" aria-label="Backspace">⌫</button>
            <button type="button" class="key key-fn key-ac" data-action="clear-all">AC</button>
            <button type="button" class="key key-op key-sub" data-action="sub" aria-label="Subtract">−</button>

            <button type="button" class="key key-n7" data-digit="7">7</button>
            <button type="button" class="key key-n8" data-digit="8">8</button>
            <button type="button" class="key key-n9" data-digit="9">9</button>
            <button type="button" class="key key-op key-add" data-action="add" aria-label="Add">+</button>

            <button type="button" class="key key-n4" data-digit="4">4</button>
            <button type="button" class="key key-n5" data-digit="5">5</button>
            <button type="button" class="key key-n6" data-digit="6">6</button>

            <button type="button" class="key key-n1" data-digit="1">1</button>
            <button type="button" class="key key-n2" data-digit="2">2</button>
            <button type="button" class="key key-n3" data-digit="3">3</button>

            <button type="button" class="key key-zero" data-digit="0">0</button>
            <button type="button" class="key key-decimal" data-action="decimal">.</button>
          </div>
        </div>
      </section>
    </main>

    <template id="tape-line-template">
      <li class="tape-line">
        <span class="line-op"></span>
        <span class="line-value"></span>
      </li>
    </template>

    <script src="js/app.js"></script>
  </body>
</html>
